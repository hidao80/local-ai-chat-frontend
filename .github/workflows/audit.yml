name: Audit

on:
  push:
    branches: [main, develop]

jobs:
  audit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

  npm-advisory-audit:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: flatt-security/setup-takumi-guard-npm@v1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
