server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep these values identical to bin/security-headers.json (checked by tests/e2e/production.spec.ts)
    # connect-src is left open because users point the app at any LLM endpoint
    # HSTS is added by whatever terminates HTTPS (e.g. a reverse proxy)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; media-src 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
