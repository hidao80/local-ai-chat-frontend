<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Block external images/media pulled in via LLM output (prevents conversation data exfiltration). connect-src stays open because users choose any LLM endpoint -->
  <meta http-equiv="Content-Security-Policy"
    content="img-src 'self' data:; media-src 'none'; object-src 'none'; form-action 'none'; base-uri 'self'" />
  <link rel="icon" type="image/svg+xml" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>llm Chat-FE</title>

  <!-- SEO -->
  <meta name="description" content="A privacy-first, browser-based chat interface for local LLMs (Ollama, GPT4ALL, LM Studio) and cloud providers. No backend required." />

  <!-- OGP -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="llm Chat-FE" />
  <meta property="og:description" content="A privacy-first, browser-based chat interface for local LLMs (Ollama, GPT4ALL, LM Studio) and cloud providers. No backend required." />
  <meta property="og:url" content="https://github.com/hidao80/local-ai-chat-frontend" />
  <meta property="og:image" content="https://hidao80.github.io/local-ai-chat-frontend/favicon.png" />
  <meta property="og:site_name" content="llm Chat-FE" />
  <meta property="og:locale" content="ja_JP" />
  <meta property="og:locale:alternate" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="llm Chat-FE" />
  <meta name="twitter:description" content="A privacy-first, browser-based chat interface for local LLMs (Ollama, GPT4ALL, LM Studio) and cloud providers. No backend required." />
  <meta name="twitter:image" content="https://hidao80.github.io/local-ai-chat-frontend/favicon.png" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "llm Chat-FE",
    "description": "A privacy-first, browser-based chat interface for local LLMs (Ollama, GPT4ALL, LM Studio) and cloud providers. No backend required.",
    "url": "https://github.com/hidao80/local-ai-chat-frontend",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Person",
      "name": "hidao80",
      "url": "https://github.com/hidao80"
    },
    "license": "https://opensource.org/licenses/MIT",
    "codeRepository": "https://github.com/hidao80/local-ai-chat-frontend"
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
